[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ynab-agent"
version = "0.7.0"
description = "YNAB agent service for transaction reminders and budget queries"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Bray" }]
requires-python = ">=3.13"
keywords = ["budgeting", "cli", "finance", "fastapi", "ynab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "ynab>=4.3.0",
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "apscheduler>=3.11.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.5",
]

[project.urls]
Homepage = "https://github.com/dtbray/ynab-agent"
Changelog = "https://github.com/dtbray/ynab-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/dtbray/ynab-agent/issues"
Source = "https://github.com/dtbray/ynab-agent"

[project.scripts]
ynab = "ynab_agent.cli:app"

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.3.0,<2.4.0",
    "ruff>=0.16.0",
]
planner = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "pyxirr>=0.10.8",
]
historical = [
    "arch>=8.0.0",
]
reports = [
    "plotly>=6.9.0",
]
postgres = [
    "asyncpg>=0.31.0",
]
mysql = [
    "asyncmy>=0.2.11",
]

[tool.setuptools.package-data]
ynab_agent = ["py.typed", "resources/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.fastapi]
entrypoint = "ynab_agent.http_api.app:app"
