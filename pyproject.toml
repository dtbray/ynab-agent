[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ynab-agent"
version = "0.6.0"
description = "YNAB agent service for transaction reminders and budget queries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ynab>=4.3.0",
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "apscheduler>=3.11.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.5",
]

[project.scripts]
ynab = "ynab_agent.cli:app"

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.3.0,<2.4.0",
    "ruff>=0.16.0",
]
planner = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "pyxirr>=0.10.8",
]
historical = [
    "arch>=8.0.0",
]
reports = [
    "plotly>=6.9.0",
]
postgres = [
    "asyncpg>=0.31.0",
]
mysql = [
    "asyncmy>=0.2.11",
]

[tool.setuptools.package-data]
ynab_agent = ["resources/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.fastapi]
entrypoint = "ynab_agent.http_api.app:app"
