name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev,planner,historical,reports]"

      - name: Compile
        run: python -m compileall src tests migrations

      - name: Lint
        run: python -m ruff check src tests migrations

      - name: Test
        run: python -m pytest

      - name: Type-check planning boundaries
        run: |
          python -m mypy \
            src/ynab_agent/planning \
            src/ynab_agent/services/wealth.py \
            src/ynab_agent/services/spending_guardrails.py \
            src/ynab_agent/services/scenario_comparison.py \
            src/ynab_agent/db/wealth.py \
            src/ynab_agent/db/spending_guardrails.py \
            src/ynab_agent/db/scenario_comparison.py \
            src/ynab_agent/http_api/routers/spending_guardrails.py \
            src/ynab_agent/http_api/routers/scenario_comparison.py \
            src/ynab_agent/http_api/schemas/spending_guardrails.py \
            src/ynab_agent/http_api/schemas/scenario_comparison.py

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/ynab-wheel-smoke
          /tmp/ynab-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/ynab-wheel-smoke/bin/ynab --help
